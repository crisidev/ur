# A Home Assistant automation blueprint for the ur watch's button grid,
# laid out as two layers (Settings → GRID → 2 LAYERS): nine buttons,
# tapped alone or two in a row, for codes 1–99. See
# docs/buttons.md#blueprints.
#
# 99 codes times their gestures are far too many to each be an input, so
# this offers three things: the nine buttons on their own (the codes most
# people use first), a few slots for any code and gesture, picked from
# lists, and one action for every press, with the code and the gesture as
# variables, for everything else.
#
# What the watch sends (see docs/buttons.md): each tap, double tap, or hold
# fires a `button` event for the gesture and a `dimmer_N` event, turning
# right by the code, for which gesture it was (1 tap, 2 double tap, 3
# hold). A long press and a release fire only the `button` event: they
# follow a hold, which said the code. So this triggers on the watch's
# events (by its device id, as Home Assistant's own device triggers do),
# and takes
#
# - taps, double taps, and holds from the dimmer events, which carry both
#   the code and the gesture, ignoring the `button` events that come with
#   them, so each press runs once;
# - long presses and releases from the `button` event, with the code of
#   the hold they follow.
#
# The automation keeps no memory between runs, so that code comes from
# Home Assistant's dimmer entities: the hold's dimmer event, the last
# before its long press or release (a finger is down all the while),
# left the code in its entity's `steps` attribute. Should Home Assistant
# miss the hold's advertisement but hear its release, the release gets
# the code before it; Bluetooth repeats each advertisement, which makes
# that rare.
blueprint:
  name: ur watch, two layers
  author: Jon Gjengset
  description: >-
    Actions for the [ur](https://github.com/jonhoo/ur) watch's button grid
    with **GRID** on **2 LAYERS**: nine buttons, numbered like a phone's
    keypad, tapped alone or two in a row for codes 1–99 (2, then 3, is 23;
    1 twice is 11). The first button is the tens digit, the second the
    ones, and the gesture is what the last one did: a tap, a double tap
    (two buttons only: 2, then 3 twice, is 23 double-tapped), or a hold. A
    hold runs **Hold** as soon as it's recognised (0.6 s, finger still
    down), **Long press** if held on to 1.5 s, and **Release** when you
    lift.


    - **Button 1–9 on its own**: one button tapped or held.

    - **Code slots**: any code and gesture, such as 23 double-tapped.

    - **Every press**: one action for every press, for codes beyond the
    slots.


    Leave any you don't need empty. First add the watch to Home
    Assistant's BTHome integration with its key (Settings → BTHOME KEY on
    the watch; see
    [docs/buttons.md](https://github.com/jonhoo/ur/blob/main/docs/buttons.md#home-assistant)).
    **Release** needs Home Assistant 2026.11 or later.
  domain: automation
  source_url: https://github.com/jonhoo/ur/blob/main/blueprints/ur-two-layers.yaml
  homeassistant:
    # Input sections (2024.6), and `triggers:`/`trigger:` (2024.10).
    min_version: 2024.10.0
