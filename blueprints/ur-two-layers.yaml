            `code` (1–99) and `gesture` (`press`, `double_press`,
            `hold_press`, `long_press`, or `hold_release`) to tell them
            apart. For example, add a **Choose** action, with a
            **Template** condition for each option, such as
            `{{ code == 47 and gesture == 'double_press' }}` for 4, then 7
            double-tapped.
          default: []
          selector:
            action: {}

# A hold sends several events in a row (hold, maybe long press, then
# release), and the hold's action may still be running when the next
# arrives: a loop that dims a light until the release, say. `parallel`
# runs each event's action at once, alongside any still running. `single`
# would drop the release while the hold's loop runs, `queued` would hold
# it back until the loop ends, and `restart` would cut the hold's action
# short at the long press, even with no Long press action set. The cost:
# two quick presses' actions can overlap, which for toggles and scenes
# doesn't matter.
mode: parallel
max: 10
max_exceeded: silent

triggers:
  - trigger: event
    event_type: bthome_ble_event
    event_data:
      device_id: !input watch

variables:
  watch: !input watch
  # The gesture, as BTHome names it, or '' for the events that only repeat
  # another's: the `button` event's tap, double tap and hold (their
  # dimmers carry the code too), and anything else (such as a dimmer
  # turning left, which the watch never sends).
  gesture: >-
    {{ {
      'dimmer_1/rotate_right': 'press',
      'dimmer_2/rotate_right': 'double_press',
      'dimmer_3/rotate_right': 'hold_press',
      'button/long_press': 'long_press',
      'button/hold_release': 'hold_release',
    }.get(trigger.event.data.event_class ~ '/' ~ trigger.event.data.event_type, '') }}
  # A dimmer's steps, or, for a long press or release, the steps of the
  # dimmer entity that changed last: the hold's (see the top of the file).
  code: >-
    {%- if trigger.event.data.event_class.startswith('dimmer_') -%}
      {{ trigger.event.data.event_properties.steps | int(0) }}
    {%- else -%}
      {{ device_entities(watch) | select('match', 'event[.]') | expand
         | selectattr('attributes.steps', 'defined')
         | sort(attribute='last_changed', reverse=true)
         | map(attribute='attributes.steps') | first | default(0) | int(0) }}
    {%- endif -%}
  slot_1_code: !input slot_1_code
  slot_1_gesture: !input slot_1_gesture
  slot_2_code: !input slot_2_code
  slot_2_gesture: !input slot_2_gesture
  slot_3_code: !input slot_3_code
  slot_3_gesture: !input slot_3_gesture
  slot_4_code: !input slot_4_code
  slot_4_gesture: !input slot_4_gesture
  slot_5_code: !input slot_5_code
  slot_5_gesture: !input slot_5_gesture
  slot_6_code: !input slot_6_code
  slot_6_gesture: !input slot_6_gesture
  slot_7_code: !input slot_7_code
  slot_7_gesture: !input slot_7_gesture
  slot_8_code: !input slot_8_code
  slot_8_gesture: !input slot_8_gesture

conditions:
  - "{{ gesture != '' and code > 0 }}"

actions:
  # The specific actions and Every press side by side, so neither waits
  # for the other (a hold's dimming loop, say).
  - parallel:
      # Code slots first, so a slot set for a single button's code (and
      # gesture) wins over that button's own input, empty or not.
      - choose:
          - conditions: "{{ code == slot_1_code | int(0) and gesture == slot_1_gesture }}"
            sequence: !input slot_1_action
          - conditions: "{{ code == slot_2_code | int(0) and gesture == slot_2_gesture }}"
            sequence: !input slot_2_action
          - conditions: "{{ code == slot_3_code | int(0) and gesture == slot_3_gesture }}"
            sequence: !input slot_3_action
          - conditions: "{{ code == slot_4_code | int(0) and gesture == slot_4_gesture }}"
            sequence: !input slot_4_action
          - conditions: "{{ code == slot_5_code | int(0) and gesture == slot_5_gesture }}"
            sequence: !input slot_5_action
          - conditions: "{{ code == slot_6_code | int(0) and gesture == slot_6_gesture }}"
            sequence: !input slot_6_action
          - conditions: "{{ code == slot_7_code | int(0) and gesture == slot_7_gesture }}"
            sequence: !input slot_7_action
          - conditions: "{{ code == slot_8_code | int(0) and gesture == slot_8_gesture }}"
            sequence: !input slot_8_action

          - conditions: "{{ code == 1 and gesture == 'press' }}"
            sequence: !input button_1_press
          - conditions: "{{ code == 1 and gesture == 'hold_press' }}"
            sequence: !input button_1_hold_press
          - conditions: "{{ code == 1 and gesture == 'long_press' }}"
            sequence: !input button_1_long_press
          - conditions: "{{ code == 1 and gesture == 'hold_release' }}"
            sequence: !input button_1_hold_release

