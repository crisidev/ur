# A hold sends several events in a row (hold, maybe long press, then
# release), and the hold's action may still be running when the next
# arrives: a loop that dims a light until the release, say. `parallel`
# runs each event's action at once, alongside any still running. `single`
# would drop the release while the hold's loop runs, `queued` would hold
# it back until the loop ends, and `restart` would cut the hold's action
# short at the long press, even with no Long press action set. The cost:
# two quick presses' actions can overlap, which for toggles and scenes
# doesn't matter.
mode: parallel
max: 10
max_exceeded: silent

# The trigger is the BTHome integration's bus event, for the chosen watch,
# rather than its device triggers (`trigger: device`, `domain: bthome`).
# Those attach this same event trigger underneath, matching the same
# fields (bthome/device_trigger.py), but are only valid for a button Home
# Assistant has already seen: with the integration loaded, one unseen
# button among an automation's device triggers disables the whole
# automation, until it's reloaded. The event entities' state triggers
# (`event.…_button_1`) would need each entity picked by hand, once it
# exists. The event's name and fields haven't changed since BTHome got
# events (2023.5), and the device triggers rely on them as much.
triggers:
  - trigger: event
    event_type: bthome_ble_event
    event_data:
      device_id: !input watch

variables:
  # `button_2` → 2. Anything else (with GRID on 2 LAYERS, the watch sends
  # `button` and `dimmer_N`) → 0, which the condition below drops.
  button: >-
    {% set event_class = trigger.event.data.event_class %}
    {{ event_class[7:] | int(0) if event_class.startswith('button_') else 0 }}
  gesture: "{{ trigger.event.data.event_type }}"

conditions:
  - "{{ 1 <= button <= 6 }}"

actions:
  - choose:
      - conditions: "{{ button == 1 and gesture == 'press' }}"
        sequence: !input button_1_press
      - conditions: "{{ button == 1 and gesture == 'double_press' }}"
        sequence: !input button_1_double_press
      - conditions: "{{ button == 1 and gesture == 'hold_press' }}"
        sequence: !input button_1_hold_press
      - conditions: "{{ button == 1 and gesture == 'long_press' }}"
        sequence: !input button_1_long_press
      - conditions: "{{ button == 1 and gesture == 'hold_release' }}"
        sequence: !input button_1_hold_release

      - conditions: "{{ button == 2 and gesture == 'press' }}"
        sequence: !input button_2_press
      - conditions: "{{ button == 2 and gesture == 'double_press' }}"
        sequence: !input button_2_double_press
      - conditions: "{{ button == 2 and gesture == 'hold_press' }}"
        sequence: !input button_2_hold_press
      - conditions: "{{ button == 2 and gesture == 'long_press' }}"
        sequence: !input button_2_long_press
      - conditions: "{{ button == 2 and gesture == 'hold_release' }}"
        sequence: !input button_2_hold_release

      - conditions: "{{ button == 3 and gesture == 'press' }}"
        sequence: !input button_3_press
      - conditions: "{{ button == 3 and gesture == 'double_press' }}"
        sequence: !input button_3_double_press
      - conditions: "{{ button == 3 and gesture == 'hold_press' }}"
        sequence: !input button_3_hold_press
      - conditions: "{{ button == 3 and gesture == 'long_press' }}"
        sequence: !input button_3_long_press
      - conditions: "{{ button == 3 and gesture == 'hold_release' }}"
        sequence: !input button_3_hold_release

      - conditions: "{{ button == 4 and gesture == 'press' }}"
        sequence: !input button_4_press
      - conditions: "{{ button == 4 and gesture == 'double_press' }}"
        sequence: !input button_4_double_press
      - conditions: "{{ button == 4 and gesture == 'hold_press' }}"
        sequence: !input button_4_hold_press
      - conditions: "{{ button == 4 and gesture == 'long_press' }}"
        sequence: !input button_4_long_press
      - conditions: "{{ button == 4 and gesture == 'hold_release' }}"
        sequence: !input button_4_hold_release

      - conditions: "{{ button == 5 and gesture == 'press' }}"
        sequence: !input button_5_press
      - conditions: "{{ button == 5 and gesture == 'double_press' }}"
        sequence: !input button_5_double_press
      - conditions: "{{ button == 5 and gesture == 'hold_press' }}"
        sequence: !input button_5_hold_press
      - conditions: "{{ button == 5 and gesture == 'long_press' }}"
