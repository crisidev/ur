# A Home Assistant automation blueprint for the ur watch's button grid,
# laid out as six buttons (Settings → GRID → 6 BUTTONS): an action for each
# button and gesture, in one automation. See docs/buttons.md#blueprints.
#
# Each press fires a `bthome_ble_event` whose `event_class` is the button
# (`button_1` … `button_6`) and whose `event_type` is the gesture, as
# BTHome names it. The automation triggers on that event (see `triggers:`
# for why), and picks the input for its button and gesture.
blueprint:
  name: ur watch, six buttons
  author: Jon Gjengset
  description: >-
    Actions for the [ur](https://github.com/jonhoo/ur) watch's button grid
    with **GRID** on **6 BUTTONS**, numbered in reading order (1 2 3 on top,
    4 5 6 below). Each button can be tapped, double-tapped, or held; a hold
    runs **Hold** as soon as it's recognised (0.6 s, finger still down),
    **Long press** if held on to 1.5 s, and **Release** when
    you lift. Leave any you don't need empty.


    First add the watch to Home Assistant's BTHome integration with its key
    (Settings → BTHOME KEY on the watch; see
    [docs/buttons.md](https://github.com/jonhoo/ur/blob/main/docs/buttons.md#home-assistant)).
    Actions can use `{{ button }}` (1–6) and `{{ gesture }}` (`press`,
    `double_press`, `hold_press`, `long_press`, or `hold_release`).
    **Release** needs Home Assistant 2026.11 or later.
  domain: automation
  source_url: https://github.com/jonhoo/ur/blob/main/blueprints/ur-six-buttons.yaml
  homeassistant:
    # Input sections (2024.6), and `triggers:`/`trigger:` (2024.10).
    min_version: 2024.10.0
  input:
    watch:
      name: Watch
      description: The watch, as the BTHome integration added it.
      selector:
        device:
          filter:
            - integration: bthome
          # Only BTHome devices with buttons (or dimmers): not thermometers.
          entity:
            - integration: bthome
              domain: event
    button_1:
      name: Button 1 (top left)
      icon: mdi:numeric-1-box
      collapsed: true
      input:
        button_1_press:
          name: Tap
          description: Once it's clear no second tap follows.
          default: []
          selector:
            action: {}
        button_1_double_press:
          name: Double tap
          description: Two taps in a row.
          default: []
          selector:
            action: {}
        button_1_hold_press:
          name: Hold
          description: As soon as the hold is recognised, finger still down.
          default: []
          selector:
            action: {}
        button_1_long_press:
          name: Long press
          description: Held on to 1.5 s, finger still down, after Hold.
          default: []
          selector:
            action: {}
        button_1_hold_release:
          name: Release
          description: On lifting the finger after a hold.
          default: []
          selector:
            action: {}
    button_2:
      name: Button 2 (top middle)
      icon: mdi:numeric-2-box
      collapsed: true
      input:
        button_2_press:
          name: Tap
