[package]
name = "ur"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.10", features = ["critical-section-single-core", "inline-asm"] }
cortex-m-rt = "0.7.7"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
embassy-embedded-hal = "0.6.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-futures = "0.1.2"
embassy-nrf = { version = "0.11.0", features = ["nrf52832", "time-driver-rtc1", "gpiote", "defmt", "rt", "nfc-pins-as-gpio"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embedded-hal-async = "1"
heapless = "0.9.3"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2.1.1"

[[bin]]
name = "ur"
# There is no test harness for this target.
test = false
bench = false

[profile.release]
# Symbols cost nothing on-device, but make defmt locations and gdb useful.
debug = 2
lto = "fat"
codegen-units = 1
opt-level = "s"

[profile.dev]
# Unoptimized embassy code is both large and slow enough to miss SPI timing.
opt-level = 1
