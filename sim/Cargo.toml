[package]
name = "ur-sim"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# A desktop simulator for the firmware's UI: runs `src/ui.rs` and the
# hardware-free modules it needs (included via `#[path]`) on the host, with
# stand-ins for the hardware. Not part of the firmware workspace: build and
# run it from this directory. See README.md here.
[workspace]

[[bin]]
name = "ur-sim"
path = "src/main.rs"

[features]
default = ["window"]
# The interactive window; without it (e.g. in CI), scripts still run and
# write screenshots.
window = ["dep:minifb"]

[dependencies]
aes = "0.8.4"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
critical-section = { version = "1", features = ["std"] }
defmt = "1.2.0"
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["defmt"] }
embassy-time-driver = { version = "0.2", features = ["tick-hz-32_768"] }
gif = { version = "0.14.2", default-features = false, features = ["std", "raii_no_panic"] }
heapless = "0.9.3"
libm = "0.2.16"
minifb = { version = "0.29.0", optional = true }
png = "0.18.1"
