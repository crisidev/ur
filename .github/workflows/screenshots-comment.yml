# Posts what a PR changes on the watch's screens, as screenshots.yml found
# it, in one comment on the PR, kept up to date as the PR changes: each
# screen that changed (before, after, and where, side by side), was
# added, or was removed. When a push leaves no screen changed, an
# existing comment says so; a PR that never changed a screen gets none.
#
# Fork-safe: screenshots.yml runs the PR's code with read-only access;
# this runs after it (on `workflow_run`, from the default branch's copy of
# this file), with write access, and never checks out or runs the PR's
# code. What it gets from that run, an artifact, is the PR's to write, so
# it's untrusted: the PR must exist and be at the commit the run was for
# (so a PR can't post on another), every file must be a PNG with a plain
# name (they become paths, upload names and alt text), and there are
# only so many, of only so large. Nothing from it reaches a shell
# command but through variables, after those checks.
#
# PR comments can't embed artifacts, and the images aren't kept in the
# repository: they're uploaded as comment attachments, as dragging an
# image into a comment on github.com does, and the comment links each by
# the `https://github.com/user-attachments/assets/…` URL GitHub gives
# back. A later push uploads its own, so an older revision of the
# comment still shows what it showed.
#
# The upload is what `gh pr comment --attach` (gh 2.99+) does, but made
# with `gh api`, because `--attach` can only create a comment or edit
# the token's *last* one, and this bot's last comment on a PR may be
# size-report.yml's. gh's own code (internal/attachments/client.go, as of
# v2.103.3) POSTs the file's bytes to
# `https://uploads.github.com/user-attachments/assets` with the query
# `name`, `content_type` and `repository_id`, `Content-Type:
# application/octet-stream`, and the same `Authorization: token …` as
# any API call; the reply is `{"url": …}`. So: upload each image, then
# edit our comment by its id, in place, as before. That endpoint isn't
# in GitHub's REST docs, only behind `--attach`, so it could change
# under us; if it does (or this token can't upload at all, which nothing
# documents either way), the comment still goes up, with the summary,
# without images, and saying so.
on:
  workflow_run:
    workflows: [screenshots]
    types: [completed]
# Nothing by default; the job asks for what it needs (as size-report.yml).
permissions: {}
# One at a time a PR, so two runs don't both create its comment. The
# names only go into the group's name, never a shell.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
name: screenshots-comment
jobs:
  post:
    runs-on: ubuntu-latest
    name: post
    permissions:
      # To download the other run's artifact.
      actions: read
      # To upload the images. Nothing is pushed: the upload endpoint
      # wants push access to the repository it attaches to (gh checks
      # for WRITE, MAINTAIN or ADMIN first, and the endpoint answers 404
      # without it), and for this token push access is `contents:
      # write`.
      contents: write
      # To comment.
      pull-requests: write
    # Only after a whole render: a cancelled run (superseded by a newer
    # push) or a failed one has nothing complete to say. Dependabot's
    # PRs' runs get a read-only token, so couldn't post anyway.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login != 'dependabot[bot]'
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # tag=v8.0.2
        with:
          name: screenshots-comment
          path: ${{ runner.temp }}/artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: post
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # What the uploads are attached to (GitHub's, as the rest).
          REPO_ID: ${{ github.event.repository.id }}
          # GitHub's, not the artifact's: the commit the run was for.
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # The screenshots run, whose artifact the comment can point to
          # when the images can't be attached.
          RUN: ${{ github.event.workflow_run.id }}
          ARTIFACT: ${{ runner.temp }}/artifact
        run: |
          set -euo pipefail
          marker='<!-- ur:screenshots -->'
          fail() {
            echo "::error::$1"
            exit 1
          }

          # ====================================================================
          # What the artifact claims, checked
          # ====================================================================

          # The PR: a number, which GitHub says is at the commit this run
          # was for. If it has moved on since, a newer run will post.
          pr=$(head -c 16 "$ARTIFACT/pr" | tr -d '\n')
          [[ $pr =~ ^[1-9][0-9]{0,8}$ ]] || fail "the artifact's PR number isn't one"
          at=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
          if [[ $at != "$HEAD_SHA" ]]; then
            echo "PR #$pr is at $at now, not $HEAD_SHA: not posting"
            exit 0
          fi
          base=$(head -c 48 "$ARTIFACT/base" | tr -d '\n')
          [[ $base =~ ^[0-9a-f]{40}$ ]] || fail "the artifact's base isn't a commit"

          # The images: only plain files and directories; each file a
          # PNG, under changed/, added/ or removed/, with a name of
          # letters, digits, `.`, `_` and `-` (not starting with `.`, so
          # no `..`); at most 200, of at most 1 MiB each.
          images="$ARTIFACT/images"
          odd=$(find "$images" -mindepth 1 -not -type d -not -type f | wc -l)
          # (Not naming them: an unchecked name could be a workflow command.)
          ((odd == 0)) || fail "the artifact has something other than files"
          name='[A-Za-z0-9][A-Za-z0-9._-]*'
          shots=()
          while IFS= read -r -d '' path; do
            rel=${path#"$images"/}
            [[ $rel == report.tsv ]] && continue
            [[ $rel =~ ^(changed|added|removed)/($name/)*$name\.png$ ]] ||
              fail "the artifact has a file it shouldn't"
            (($(stat -c %s "$path") <= 1048576)) || fail "$rel is too large"
            [[ $(head -c 8 "$path" | od -An -tx1 | tr -d ' \n') == 89504e470d0a1a0a ]] ||
              fail "$rel isn't a PNG"
            shots+=("$rel")
          done < <(find "$images" -type f -print0 | sort -z)
          ((${#shots[@]} <= 200)) || fail "the artifact has too many images"

          # How many pixels each changed screen differs in, from the
          # report: only lines that are exactly a known shot and a number.
          declare -A pixels=()
          if [[ -f $images/report.tsv ]]; then
            while IFS=$'\t' read -r kind shot count; do
              if [[ $kind == changed && $shot =~ ^($name/)*$name\.png$ && $count =~ ^[0-9]{1,9}$ ]]; then
                pixels[$shot]=$count
              fi
            done < <(head -c 65536 "$images/report.tsv")
          fi

          # ====================================================================
          # The comment so far, if any
          # ====================================================================

          # By this bot, and starting with the marker: the bot's last
          # comment may well be size-report.yml's instead.
          comment=$(gh api --paginate "repos/$REPO/issues/$pr/comments" --jq \
            ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" |
            sed -n 1p)
          [[ -z $comment || $comment =~ ^[0-9]+$ ]] || fail "odd comment id"
          if ((${#shots[@]} == 0)) && [[ -z $comment ]]; then
            echo "No screen changed, and nothing posted before: not posting"
            exit 0
          fi

          # ====================================================================
          # The images, attached
          # ====================================================================

          # Each image uploaded as `gh pr comment --attach` would (see the
          # top of this file), for a URL to put in the comment. All or
          # nothing: at the first failure, the comment goes up without
          # images, saying why, rather than with some of them, where a
          # missing one would look like a removed screen. What did upload
          # stays on GitHub, unreferenced: there's no endpoint to delete
          # an upload.
          #
          # gh comes with the runner image (2.103.3 on both ubuntu-24.04
          # and 26.04, as of their 20261101 images). This needs only `gh
          # api` with an absolute URL and `--input`, which long predate
          # `--attach`, so no particular gh is installed; its version goes
          # in the log, for when an upload fails.
          #
          # TODO: GitHub limits content-creating requests to about 80 a
          # minute. A PR that changes more screens than that may need the
          # uploads paced; for now, it gets the comment without images.
          declare -A urls=()
          attached=
          if ((${#shots[@]} > 0)); then
            [[ $REPO_ID =~ ^[1-9][0-9]*$ ]] || fail "odd repository id"
            gh --version | head -n 1
            attached=1
            for rel in "${shots[@]}"; do
              # The `-f` fields go into the query, as `--input` is the body;
              # gh sends the file's size as its Content-Length. On failure
              # gh prints GitHub's status and message, which hold nothing
              # of the artifact's.
              rc=0
              reply=$(gh api --method POST https://uploads.github.com/user-attachments/assets \
                -H 'Content-Type: application/octet-stream' \
                -H 'Accept: application/vnd.github+json' \
                -f name="${rel##*/}" -f content_type=image/png -f repository_id="$REPO_ID" \
                --input "$images/$rel" --jq .url) || rc=$?
              # GitHub's reply, but it goes into the comment, so it must
              # be what an attachment's URL looks like, and nothing else.
              if ((rc == 0)) && [[ $reply =~ ^https://github\.com/user-attachments/assets/[A-Za-z0-9-]+$ ]]; then
                urls[$rel]=$reply
                continue
              fi
              if ((rc == 0)); then
                echo "::warning::uploading $rel got a reply that isn't an attachment's URL"
              else
                echo "::warning::couldn't upload $rel (gh exited with $rc): posting without images"
              fi
              attached=
              break
            done
          fi

          # Where the images are when they couldn't be attached: the
          # screenshots run's artifact, if GitHub names it, else the run.
          if ((${#shots[@]} > 0)) && [[ -z $attached ]]; then
            [[ $RUN =~ ^[1-9][0-9]*$ ]] || fail "odd run id"
            runs="$GITHUB_SERVER_URL/$REPO/actions/runs"
            artifact_url="$runs/$RUN"
            artifact_id=$(gh api "repos/$REPO/actions/runs/$RUN/artifacts" \
              --jq '.artifacts[] | select(.name == "screenshots-comment") | .id' || true)
            if [[ $artifact_id =~ ^[1-9][0-9]*$ ]]; then
              artifact_url="$runs/$RUN/artifacts/$artifact_id"
            fi
          fi

          # ====================================================================
          # The comment
          # ====================================================================

          body="$RUNNER_TEMP/body.md"
          count() {
            local n=0 rel
            for rel in "${shots[@]}"; do [[ $rel == "$1"/* ]] && n=$((n + 1)); done
            echo "$n"
          }
          {
            echo "$marker"
            echo "### Screenshots"
            echo
            printf 'What this PR changes on the watch'\''s screens, as the simulator draws them: '
            printf 'its head, %s, against %s, where it branched off. ' "$HEAD_SHA" "$base"
            if ((${#shots[@]} == 0)); then
              echo "**No screen changed.**"
            else
              echo "$(count changed) changed, $(count added) added, $(count removed) removed."
            fi
            if ((${#shots[@]} > 0)) && [[ -z $attached ]]; then
              echo
              printf '> [!WARNING]\n'
              printf '> **The images couldn'\''t be attached** (see [this run'\''s log](%s)). ' \
                "$runs/$GITHUB_RUN_ID"
              # shellcheck disable=SC2016 # The backticks are Markdown's.
              printf 'They'\''re in the [`screenshots-comment` artifact](%s) ' "$artifact_url"
              printf 'of the run that drew them, kept for 7 days after it.\n'
            fi
            for kind in changed added removed; do
              n=$(count "$kind")
              ((n > 0)) || continue
              echo
              case $kind in
                changed) echo "<details open><summary>Changed ($n): before, after, and where (magenta)</summary>" ;;
                added) echo "<details open><summary>Added ($n)</summary>" ;;
                removed) echo "<details open><summary>Removed ($n)</summary>" ;;
              esac
              for rel in "${shots[@]}"; do
                [[ $rel == "$kind"/* ]] || continue
                shot=${rel#"$kind"/}
                echo
                if [[ $kind == changed && -n ${pixels[$shot]:-} ]]; then
                  echo "\`$shot\`: ${pixels[$shot]} pixels differ"
                else
                  echo "\`$shot\`"
                fi
                if [[ -n $attached ]]; then
                  echo
                  echo "<img src=\"${urls[$rel]}\" alt=\"$shot ($kind)\">"
                fi
              done
              echo
              echo "</details>"
            done
          } >"$body"

          # Edited in place by its id when there is one, so a push
          # notifies no one; created only the first time.
          payload="$RUNNER_TEMP/payload.json"
          jq -n --rawfile body "$body" '{body: $body}' >"$payload"
          if [[ -n $comment ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$comment" --input "$payload" >/dev/null
            echo "Updated the comment on PR #$pr"
          else
            gh api "repos/$REPO/issues/$pr/comments" --input "$payload" >/dev/null
            echo "Commented on PR #$pr"
          fi
