# Publishes the simulator's web page (sim/web/) to GitHub Pages, so the
# watch can be tried in a browser at the repository's Pages URL
# (https://jonhoo.github.io/ur/), as of the latest commit on main.
#
# Needs Pages switched on, with GitHub Actions as its source (Settings,
# Pages, "Build and deployment"); until then, this fails at "configure".
#
# test.yml's sim-web job checks the same build on every PR (and that its
# screenshots match the command line's); this only builds and deploys.
permissions:
  contents: read
on:
  push:
    branches: [main]
    # The simulator includes the firmware's own UI modules, and its
    # version from Cargo.toml.
    paths:
      - "src/**"
      - "sim/**"
      - "Cargo.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
# One deployment at a time, and never cut short: a newer push queues
# behind the one deploying.
concurrency:
  group: pages
  cancel-in-progress: false
name: pages
jobs:
  build:
    runs-on: ubuntu-latest
    name: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # tag=v2.9.3
        with:
          workspaces: sim
          key: web
      - name: configure
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # tag=v6.0.0
      - name: web/build.sh
        working-directory: sim
        run: web/build.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # tag=v5.0.0
        with:
          path: sim/target/web/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: deploy
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # tag=v5.0.1
