[package]
name = "gb-buckets-test"
version = "0.1.0"
edition = "2024"
publish = false

# Host-side tests for `src/gb_buckets.rs` (included via `#[path]`), against
# a model of Gadgetbridge's Bangle.js sample store. Not part of the firmware
# workspace: run `cargo test` from this directory.
[workspace]

[dependencies]

# CI runs the host tests with `--release`; keep the arithmetic checks and
# the module's own `debug_assert!`s, so that a broken invariant fails a
# test here, not only under `cargo test`.
[profile.release]
overflow-checks = true
debug-assertions = true

[dev-dependencies]
quickcheck = { version = "1.1.0", default-features = false }

# `cargo kani` builds with `--cfg kani`, for the proofs in `src/main.rs`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
