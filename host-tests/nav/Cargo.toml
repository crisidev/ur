[package]
name = "nav-test"
version = "0.1.0"
edition = "2024"
publish = false

# Host-side tests for `src/nav.rs` (included via `#[path]`). Not part of
# the firmware workspace: run `cargo test` from this directory.
[workspace]

[dependencies]

[dev-dependencies]
bolero = "0.13.7"

[lints.rust]
# `cargo kani` sets `cfg(kani)` for the proofs at the end of src/main.rs.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

# CI runs the host tests with `--release`; keep the arithmetic checks.
[profile.release]
overflow-checks = true

# What `cargo bolero test` builds with (see `src/fuzz.rs`): fast, but
# with the arithmetic checks, as above.
[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1
overflow-checks = true
