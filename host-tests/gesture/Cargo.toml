[package]
name = "gesture-test"
version = "0.1.0"
edition = "2024"
publish = false

# Host-side tests for `src/gesture.rs` (included via `#[path]`). Not part of
# the firmware workspace: run `cargo test` from this directory.
[workspace]

[dependencies]
critical-section = { version = "1", features = ["std"] }
embassy-time = { version = "0.5.1", features = ["mock-driver", "generic-queue-8"] }
