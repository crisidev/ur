[package]
name = "aranet-test"
version = "0.1.0"
edition = "2024"
publish = false

# Host-side tests for `src/aranet.rs` and `src/bthome_sensor.rs` (included
# via `#[path]`): Aranet4 advertisements, from Aranet4-Python's own test
# vectors, BTHome thermometers', and choosing the nearest sensor. Not part of the firmware workspace: run `cargo test` from
# this directory.
[workspace]

[dependencies]
heapless = "0.9.3"

[dev-dependencies]
quickcheck = { version = "1.1.0", default-features = false }

# CI runs the host tests with `--release`; keep the arithmetic checks.
[profile.release]
overflow-checks = true
