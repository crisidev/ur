[package]
name = "mcuboot-test"
version = "0.1.0"
edition = "2024"
publish = false

# Host-side tests for `src/mcuboot.rs` (included via `#[path]`): checking
# firmware updates before they're installed. Not part of the firmware
# workspace: run `cargo test` from this directory.
[workspace]

[dependencies]
defmt = "1.2.0"

[dev-dependencies]
bolero = "0.13.7"
quickcheck = { version = "1.1.0", default-features = false }
sha2 = "0.10"

# CI runs the host tests with `--release`; keep the arithmetic checks, so
# that an image that would wrap a number round fails a test here.
[profile.release]
overflow-checks = true
# And the modules' own `debug_assert!`s, which a release build drops.
debug-assertions = true

# What `cargo bolero test` builds with (see `src/fuzz.rs`): fast, as a
# fuzzer is only as good as the images it gets through, but with the
# arithmetic checks, as above.
[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1
overflow-checks = true

# `cargo kani` builds with `--cfg kani`, for the proofs in `src/main.rs`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

# The TLV proof stubs SHA-256 out (`kani::stub`), which Kani still calls
# unstable.
[package.metadata.kani.unstable]
stubbing = true
