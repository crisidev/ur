version = "0.1.0"
edition = "2024"
publish = false

# Host-side tests for `src/alarm.rs` (included via `#[path]`). Not part of
# the firmware workspace: run `cargo test` from this directory.
[workspace]

[dependencies]

[lints.rust]
# `cargo kani` sets `cfg(kani)` for the proofs at the end of src/main.rs.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
