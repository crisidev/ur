[package]
name = "ppg-test"
version = "0.1.0"
edition = "2024"
publish = false

# Host-side tests for `src/ppg.rs` (included via `#[path]`). Not part of the
# firmware workspace: build with `--manifest-path` and the host target.
[workspace]

[dependencies]
libm = "0.2.16"

[dev-dependencies]
bolero = "0.13.7"

# CI runs the host tests with `--release`; keep the arithmetic checks.
[profile.release]
overflow-checks = true

# What `cargo bolero test` builds with (see `src/fuzz.rs`): fast, but
# with the arithmetic checks, as above.
[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1
overflow-checks = true
