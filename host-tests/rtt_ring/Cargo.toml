[package]
name = "rtt-ring-test"
version = "0.1.0"
edition = "2024"
publish = false

# Host-side tests for `src/rtt_ring.rs` (included via `#[path]`). Not part of
# the firmware workspace: run `cargo test` from this directory.
[workspace]

[dependencies]

# CI runs the host tests with `--release`; keep the arithmetic checks and
# the module's own `debug_assert!`s, so that an index that would wrap
# round fails a test here.
[profile.release]
overflow-checks = true
debug-assertions = true

# `cargo kani` builds with `--cfg kani`, for the proofs in `src/main.rs`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
