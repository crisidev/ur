[package]
name = "gb-test"
version = "0.1.0"
edition = "2024"
publish = false

# Host-side tests for `src/gb.rs` (included via `#[path]`, with the modules
# it uses), fed Gadgetbridge's lines as it sends them. Not part of the
# firmware workspace: run `cargo test` from this directory.
[workspace]

[dependencies]
defmt = "1.2.0"
heapless = "0.9.3"
libm = "0.2.16"

[dev-dependencies]
bolero = "0.13.7"
quickcheck = { version = "1.1.0", default-features = false }
serde_json = "1.0.154"

# CI runs the host tests with `--release`; keep the arithmetic checks, so
# that a line that would wrap a number round fails a test here.
[profile.release]
overflow-checks = true
# And the modules' own `debug_assert!`s, which a release build drops.
debug-assertions = true

# What `cargo bolero test` builds with (see `fuzz` in `src/main.rs`): fast,
# as a fuzzer is only as good as the lines it gets through, but with the
# arithmetic checks, as above.
[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1
overflow-checks = true

# `cargo kani` builds with `--cfg kani`, for the proofs in `src/main.rs`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
