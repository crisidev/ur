[build]
# The PineTime's nRF52832 is a Cortex-M4F.
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
# Flashes over SWD with an esprobe, the probe ur was developed with (see
# CONTRIBUTING.md). For another probe, set
# CARGO_TARGET_THUMBV7EM_NONE_EABIHF_RUNNER to your own runner, which
# overrides this without changing the repository.
runner = "scripts/run-esprobe.sh"
# `target-cpu`: the target's default is any ARMv7E-M; telling LLVM it's a
# Cortex-M4 (which the nRF52832 is) saves ~0.2 KB. A worktree nested in the
# checkout passes this twice (see build.rs), which is harmless. (The `aes`
# crate's compact AES, `--cfg aes_compact`, would save 0.8 KB more, but is
# slower; it was tried and dropped in favour of the fast default.)
rustflags = ["-C", "target-cpu=cortex-m4"]
# The linker scripts are passed by build.rs, not `rustflags` here; see there
# for why.

[env]
DEFMT_LOG = "info"
# The Nordic crates (nrf-sdc-sys, nrf-mpsl-sys) generate their bindings
# with bindgen, which parses the headers with libclang (the newest one
# installed) but takes the include paths from the `clang` on PATH, passed
# as `-isystem`. When those are different LLVM releases, as on GitHub's
# Ubuntu 26.04 image (libclang 22, `clang` 21), libclang's own `stdint.h`
# include_next's the other release's, whose include guard it has already
# set, so `uint32_t` and friends are never defined and bindgen fails.
# `-ffreestanding`, which firmware is (there's no C library), makes
# clang's `stdint.h` define the types itself instead of deferring to a
# hosted one, so any pair works, and an installed newlib can't sneak into
# the bindings either. The bindings come out as they did without it; they
# differ between libclang releases only in doc comments (23 adds some to
# macros), and the firmware built is the same with any of them. A value
# of this variable in the environment takes precedence over this one.
BINDGEN_EXTRA_CLANG_ARGS_thumbv7em_none_eabihf = "-ffreestanding"
